# Configuration of cargo-mutants, see the mutation testing section of
# CONTRIBUTING.md.

# Mutants of one crate can be caught by the tests of the crates that use it.
test_workspace = true

# Mutants that can't change the behaviour of the solver. Two more can't be
# excluded by name without excluding mutants that are caught, they stay
# missed: `rank < n_rows` → `>` in
# openmodelica_total_pivot_solver/src/solve.rs only guards a warning, and
# `i + 1` → `i * 1` in eliminate_below_pivot only eliminates the pivot column
# too, which is set to 0 right afterwards.
exclude_re = [
  # `h *= -1.0` and `h /= -1.0` are the same
  'model_functions\.rs.*replace \*= with /= in forward_differences',
  # The scaling of `λ` is 1
  'homotopy_function\.rs.*replace \* with / in <impl ModelFunctions for (Newton|Fixpoint)Homotopy<.*>>::derivative',
  # The solver doesn't call `log_enabled!`, `log` checks the level itself
  'logger\.rs.*replace <impl log::Log for CLogger>::enabled -> bool',
  # An entry equal to the maximum doesn't change it
  'scaling\.rs.*replace > with >= in rows',
  # For `a₂ = 0` both forms of the root are equal
  'cubic_interpolation\.rs.*replace > with >= in cubic_interpolation',
]
