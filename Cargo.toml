[workspace]
resolver = "3"
members = [
    "openmodelica_nls_model",
    "openmodelica_permuted_matrix",
    "openmodelica_total_pivot_solver",
    "openmodelica_newton",
    "openmodelica_homotopy",
    "openmodelica_homotopy_capi",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause OR AGPL-3.0-only OR LicenseRef-OSMC-PL-1.8"

[workspace.dependencies]
faer = "=0.24.4"
log = "0.4.34"
env_logger = "0.11.11"
equator = "0.6.0"
testing_logger = "0.1.1"

[workspace.lints.rust]
# hidden lifetime parameters in types are deprecated
elided_lifetimes_in_paths = "warn"
