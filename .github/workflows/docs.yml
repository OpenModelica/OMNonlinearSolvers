name: Documentation and coverage

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-llvm-cov
      - run: cargo doc --no-deps --document-private-items
      - run: cargo llvm-cov --html
      - name: Assemble site
        run: |
          mkdir _site
          cp -r target/doc/. _site/
          # rustdoc has no top-level index.html, redirect to the crate docs
          echo '<meta http-equiv="refresh" content="0; url=openmodelica_homotopy/index.html">' > _site/index.html
          cp -r target/llvm-cov/html _site/coverage
          # shields.io endpoint for the coverage badge in the README
          percent=$(cargo llvm-cov report --json --summary-only | jq '.data[0].totals.lines.percent')
          color=$(jq -nr --argjson p "$percent" 'if $p >= 80 then "brightgreen" elif $p >= 60 then "yellow" else "red" end')
          jq -n --argjson p "$percent" --arg c "$color" \
            '{schemaVersion: 1, label: "coverage", message: "\($p | floor)%", color: $c}' > _site/coverage/badge.json
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
