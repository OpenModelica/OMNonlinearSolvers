# Configuration of Codecov, see https://docs.codecov.com/docs/codecov-yaml
coverage:
  status:
    # The coverage of the whole workspace may drop by at most 0.5 points
    project:
      default:
        target: auto
        threshold: 0.5%
    # The lines a pull request adds or changes
    patch:
      default:
        target: 90%
